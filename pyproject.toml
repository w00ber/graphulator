[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphulator"
version = "0.14.1"
description = "Interactive graph drawing tools for graph coupled mode theory, including frequency converters, amplifiers, and filters."
readme = "README.md"
authors = [
    {name = "J. Aumentado"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = ["graph", "visualization", "quantum", "circuit", "coupled-mode-theory"]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.4.0,<6.9.0",  # 6.9+ has DLL issues on Windows
    "matplotlib>=3.6.0",
    "numpy>=1.23.0",
    "sympy>=1.11.0",
    "seaborn>=0.12.0",
    "more-itertools>=9.0.0",
    "pymupdf>=1.23.0",  # SVG->PDF conversion so clipboard/PDF text exports as outlines (no font dependency)
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    # undefined-name sweep, run from inside the suite
    # (tests/test_gui_dialogs.py::test_no_undefined_names_in_the_package)
    "pyflakes>=3.0",
]
dev = [
    "pytest>=7.0",
    "pyflakes>=3.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/w00ber/graphulator"
Documentation = "https://github.com/w00ber/graphulator#readme"
Repository = "https://github.com/w00ber/graphulator"
Issues = "https://github.com/w00ber/graphulator/issues"

[project.scripts]
graphulator = "graphulator.cli:main"
paragraphulator = "graphulator.graphulator_para:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphulator = [
    "help_para.md",
    "tutorial.md",
    "tutorial_images/*",
    "examples/graphs/*.graph",
    "examples/pgraphs/*.pgraph",
    "katex/*.js",
    "katex/*.css",
    "katex/fonts/*",
    "katex/contrib/*.js",
    "assets/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
# The two monolithic app files predate the tooling; lint the maintained
# modules first and shrink this list as code migrates out of them.
#
# NOTE this exclusion is for STYLE only. It is not a licence for undefined
# names: three live NameErrors hid in graphulator_para.py precisely because
# it is listed here (an edit dialog referenced `original_node`, and both
# scattering dialogs handed undefined names to the row scroller). The CI
# lint job therefore runs F821 over EVERY tracked .py file as a separate
# step -- passing explicit paths bypasses this list -- and
# tests/test_gui_dialogs.py re-runs the same check inside the suite so it
# fails locally too. Shrink the list, but do not rely on it hiding F821.
extend-exclude = [
    "src/graphulator/graphulator_qt.py",
    "src/graphulator/graphulator_para.py",
    "src/graphulator/autograph.py",
    "examples",
    "building",
    "misc",
]

[tool.ruff.lint]
# Conservative starter set: errors, pyflakes, import order
select = ["E", "F", "I"]
ignore = [
    "E501",  # long lines: legacy code has many; revisit after refactors
    "E741",  # ambiguous variable names (I, l) common in matrix math
]

[tool.ruff.lint.per-file-ignores]
# Importing a pytest fixture by name and then taking it as a test argument
# is the documented way to share fixtures, and it reads as a redefinition to
# every static checker. All 71 F811 in the suite were this one pattern on
# `para`, which is enough noise to make `ruff check .` useless as a signal.
"tests/*.py" = ["F811"]
# Some GUI test modules must set QT_QPA_PLATFORM before Qt is imported, so
# their imports deliberately sit below that block. I001 would hoist them
# back and the breakage only shows when the file is run alone.
"tests/test_stepped_line.py" = ["F811", "I001"]
"tests/test_gui_dialogs.py" = ["F811", "I001"]
"tests/test_intermode_lee2013.py" = ["F811", "I001"]
"tests/test_pump_sector_rule.py" = ["F811", "I001"]
# The reference oracle is vendored VERBATIM and compared against operation
# for operation; reformatting it (E702 semicolons, import order) would
# silently break the thing every physics gate is measured against.
"tests/cmtline_core.py" = ["E", "F", "I"]
