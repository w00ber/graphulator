name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # One non-Linux sanity run on the version the release builds use
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 xvfb

      - name: Install package
        run: pip install -e ".[test]"

      - name: Import smoke test
        run: python -c "import graphulator; import graphulator.autograph; import graphulator.graph_primitives; print(graphulator.__version__)"

      - name: Run tests (Linux, with virtual display so GUI tests run)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest tests/

      - name: Run tests (macOS/Windows, GUI tests skip without a display)
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/
